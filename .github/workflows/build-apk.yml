name: Build Ombax APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate android folder if missing
        working-directory: ./ombax
        run: |
          ls -la
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name ombax
          fi
          flutter pub get

      - name: Build APK
        working-directory: ./ombax
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ombax-pro-apk
          path: ombax/build/app/outputs/flutter-apk/app-release.apk
